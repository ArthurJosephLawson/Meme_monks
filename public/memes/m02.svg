<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <rect width="800" height="700" fill="#0c110e"/>
  <rect x="12" y="12" width="776" height="676" fill="none" stroke="#00FF66" stroke-width="3" opacity="0.45"/>
  <text x="400" y="110" text-anchor="middle" font-family="monospace" font-size="38" font-weight="bold" fill="#eafff2">IT WORKS ON</text>
  <text x="400" y="165" text-anchor="middle" font-family="monospace" font-size="38" font-weight="bold" fill="#00ff66">MY MACHINE</text>

